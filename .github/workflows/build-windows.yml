# «Twine СИГНАЛЫ»: проверка и сборка программы для Windows.
# Запускается при каждом обновлении ветки main и вручную (Actions → Run workflow).
# Результат — релиз с архивом программы:
# https://github.com/<владелец>/<репозиторий>/releases/latest

name: Сборка для Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  test:
    name: Тесты Twine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установка
        run: npm ci --ignore-scripts
      - name: Проверка типов
        run: npx tsc --noEmit -p tsconfig.json && npx tsc --noEmit -p tsconfig.electron.json
      - name: Тесты
        # Упавшие наборы тестов перезапускаются один раз (в Twine есть
        # нестабильные тесты); оставшиеся ошибки выводятся как пометки
        # (annotations), чтобы их было видно без скачивания журнала.
        shell: bash
        run: |
          if npx jest --maxWorkers=2 --json --outputFile=jest.json > /dev/null 2> jest.log; then
            exit 0
          fi
          FAILED=$(node -e "const r=require('./jest.json');console.log(r.testResults.filter(t=>t.status!=='passed').map(t=>t.name).join(' '))")
          echo "Перезапуск: $FAILED"
          if [ -n "$FAILED" ] && npx jest --maxWorkers=1 --json --outputFile=jest2.json $FAILED > /dev/null 2>> jest.log; then
            exit 0
          fi
          node -e "
            const fs=require('fs');
            const f=fs.existsSync('jest2.json')?'jest2.json':'jest.json';
            const r=JSON.parse(fs.readFileSync(f));
            for (const t of r.testResults) {
              if (t.message) console.log('::error title=' + require('path').basename(t.name) + '::' + t.message.replace(/\x1b\[[0-9;]*m/g,'').slice(0,1500).replace(/\n/g,'%0A'));
            }
          " || true
          tail -50 jest.log | sed 's/^/::error::/' | head -50
          exit 1

  windows:
    name: Программа для Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установка
        run: npm ci --ignore-scripts
      - name: Сборка интерфейса
        shell: bash
        run: |
          npx tsc
          npx vite build
          mkdir -p electron-build/renderer
          cp -r dist/web/. electron-build/renderer/
      - name: Сборка основной части
        run: npm run build:electron-main
      - name: Упаковка (архив .zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder.config.js --windows --x64 --publish=never
      - name: Файлы для релиза
        shell: bash
        run: |
          mkdir -p release
          cp dist/electron/*.zip release/
          cp signaly/template/27_03_2025.twee release/
          cp signaly/template/MEDIA.md release/
          ls -la release
      - name: Сохранить как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Twine-SIGNALY-Windows
          path: release/
          retention-days: 30
      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Twine СИГНАЛЫ — сборка ${{ github.run_number }}
          body: |
            Программа «Twine СИГНАЛЫ» для Windows (основа — Twine 2.12.1).
            Скачайте архив Twine-SIGNALY-…-Windows.zip, распакуйте и запустите «Twine СИГНАЛЫ.exe».
            Исправленный шаблон — 27_03_2025.twee (в нём радио, «Атмосфера» и музыка на общем плеере), список медиафайлов — MEDIA.md.
            Коммит: ${{ github.sha }}
          files: release/*
          make_latest: true
